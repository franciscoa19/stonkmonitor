name: Checks

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        timezone: [UTC, America/New_York]
    env:
      TZ: ${{ matrix.timezone }}
      ALPACA_API_KEY: unused-ci-key
      ALPACA_SECRET_KEY: unused-ci-secret
      UW_ENABLED: 'false'
      AUTO_TRADE_ENABLED: 'false'
      IV_EXEC_ENABLED: 'false'
      TELEGRAM_ALERTS_ENABLED: 'false'
      DISCORD_ALERTS_ENABLED: 'false'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -c 'import main'
      - run: python -m pip install pip-audit
      - run: pip-audit

  frontend:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_TELEMETRY_DISABLED: '1'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - name: Report development advisories; fail on critical
        # Tailwind 3 currently has high/moderate development-only advisories.
        run: npm audit --audit-level=critical
